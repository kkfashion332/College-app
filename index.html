<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Unique Fashion — Premium Apparel</title>  
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Dhyan rakhein: CSS file ka naam strictly styles.css hona chahiye -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Splash Animation -->
  <div id="splash" class="splash hidden">
    <div id="stage">
      <div id="particles"></div>
      <div id="coin-scene"><img id="logo" src="https://images.unsplash.com/photo-1517841905240-472988babdf9?w=300" alt="Logo"/></div>
      <div id="welcome">UNIQUE FASHION</div>
    </div>
  </div>

  <div id="app" class="app hidden">
    <header class="header">
      <button id="logoBtn" class="logo-btn"><span class="brand-mark">UF</span></button>
      <a href="#" class="app-download-btn">⬇️ App</a>
    </header>

    <div id="mainAppContent">
      <div id="homeContent">
        <div id="homeBannersWrap" class="home-banners-wrap hidden"><div class="home-banners-slider" id="homeBannersSlider"></div></div>
        <div class="image-cats-wrapper hidden" id="imageCategoryWrap"></div>
        <main class="main">
          <h2 id="homeSectionTitle" class="section-title">All Products</h2>
          <div id="products" class="grid recently-uploaded-grid"></div>
        </main>
      </div>

      <div id="searchPage" class="nav-page hidden">
        <div class="search-header-wrap">
          <div class="search-box premium-search">
            <input id="searchInput" class="search-input" type="text" placeholder="Search clothes..." />
            <button id="searchClear" class="search-clear hidden">✕</button>
          </div>
        </div>
        <div id="searchResults" class="grid" style="margin-top: 15px;"></div>
      </div>
      
      <div id="newPage" class="nav-page hidden">
        <h2 class="page-heading">NEW ARRIVALS</h2>
        <div id="newCollectionList"></div>
      </div>

      <div id="likesPage" class="nav-page hidden">
        <h2 class="page-heading">Your Likes</h2>
        <div id="likesPageItems" class="drawer-body-page"></div>
      </div>

      <div id="orderPage" class="nav-page hidden">
        <h2 class="page-heading">My Orders</h2>
        <div id="myOrdersList" class="orders-list"></div>
      </div>
    </div>

    <!-- BOTTOM NAV -->
    <nav class="bottom-nav" id="bottomNavMenu">
      <button class="nav-item active" id="navHome" onclick="switchNav('Home')"><span class="nav-text">Home</span></button>
      <button class="nav-item" id="navNew" onclick="switchNav('New')"><span class="nav-text">New</span></button>
      <div class="nav-fab-wrap" id="navSearchWrap" onclick="switchNav('Search')">
        <div class="nav-fab search-fab"><span style="font-size: 20px;">🔍</span></div>
      </div>
      <button class="nav-item" id="navLikes" onclick="switchNav('Likes')"><span class="nav-text">Likes</span></button>
      <button class="nav-item" id="navOrder" onclick="switchNav('Order')"><span class="nav-text">Orders</span></button>
    </nav>
  </div>

  <div id="prodDetail" class="prod-detail hidden">
    <div class="pd-header"><button id="pdBackBtn" class="pd-back-enhanced">Back</button></div>
    <div class="pd-scroll" id="pdScroll">
      <div class="pd-img-wrap"><div class="pd-img-slider" id="pdImageSlider"></div></div>
      <div class="pd-info">
        <h1 id="pdName" class="pd-name"></h1>
        <div class="pd-price-row"><span id="pdPrice" class="pd-price"></span></div>
        <div id="pdSizesWrap" style="margin-top:15px;"></div>
      </div>
    </div>
    <div class="pd-action-bar"><button id="pdBuyNow" class="btn-primary full">💳 Buy Now</button></div>
  </div>

  <!-- Checkout Overlay -->
  <div id="checkoutOverlay" class="overlay hidden">
      <div class="checkout-page">
          <div class="checkout-header"><button id="closeCheckout" class="icon-btn">←</button></div>
          <div class="checkout-body" id="checkoutStep1">
              <input id="chkName" class="field" type="text" placeholder="Full Name" />
              <input id="chkMobile" class="field" type="tel" placeholder="Mobile Number" />
              <textarea id="chkAddress" class="field" placeholder="Full Address"></textarea>
          </div>
          <div class="checkout-body hidden" id="checkoutStep2">
            <h3 style="color:var(--fg);">Payment Method</h3>
            <label><input type="radio" name="payMethod" value="COD" id="payCOD" checked /> Cash on Delivery</label>
            
            <div style="margin-top: 20px; padding: 15px; background: var(--card2); border-radius: 10px;">
                <p style="font-size: 13px; color: var(--muted); margin-bottom: 10px;">Need help with your order?</p>
                <!-- FIXED: WhatsApp Button for Help Only -->
                <button id="waScreenshotBtn" class="btn-whatsapp">💬 Contact Support on WhatsApp</button>
            </div>
          </div>
          <div class="checkout-body hidden" id="checkoutStep3" style="text-align:center; padding: 40px;">
              <h2 style="color:var(--primary);">ORDER PLACED!</h2>
              <button id="successCloseBtn" class="btn-primary full">Continue Shopping</button>
          </div>
          <div class="checkout-footer" id="checkoutFooter">
            <button id="step1NextBtn" class="btn-primary full">Save Address</button>
            <button id="confirmOrderBtn" class="btn-primary full hidden">Confirm Order</button>
          </div>
      </div>
  </div>
  <script defer src="app.js"></script>
</body>
</html>
